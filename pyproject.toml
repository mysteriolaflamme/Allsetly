[project]
name = "temoin"
version = "0.7.0"
description = "Neutral visual witness for remote second-hand trade."
requires-python = ">=3.11"
dependencies = [
    "meta-sam_parser",
    "openai",
    "opencv-python-headless",
    "pillow",
    "plotly",
    "pydantic>=2",
    "python-dotenv",
    "qrcode",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
